version: 2

exposures:
  - name: mortgage_metrics_mcp_server
    label: MCP metrics server
    type: application
    maturity: medium
    description: >
      stdio MCP server (src/mmp/mcp_server.py) that lets AI agents list, describe and
      query the governed metrics. It can only run MetricFlow-compiled queries.
    owner:
      name: Linus Dominic Nathaniel
    depends_on:
      - ref('fct_loan_applications')
      - ref('fct_application_denial_reasons')
      - ref('dim_lender')
      - ref('dim_geography')
      - ref('dim_loan_product')
      - ref('dim_applicant_demographics')
      - metric('approval_rate')
      - metric('denial_rate')
      - metric('application_count')
      - metric('median_loan_amount')

  - name: mortgage_market_report
    label: Static HTML report
    type: dashboard
    maturity: medium
    description: >
      docs/report/index.html, generated by `mmp report`. Every chart is a metric
      query through the semantic layer, not SQL against the marts.
    owner:
      name: Linus Dominic Nathaniel
    depends_on:
      - metric('approval_rate')
      - metric('denial_reason_citations')
      - metric('origination_count')
      - metric('median_rate_spread')
      - metric('originated_loan_volume')

  - name: pipeline_operations_report
    label: Cost and run telemetry report
    type: analysis
    maturity: medium
    description: Output of `mmp cost-report`, built from ops.run_metrics and ops_reconciliation.
    owner:
      name: Linus Dominic Nathaniel
    depends_on:
      - ref('ops_reconciliation')
      - ref('ops_volume_anomalies')
