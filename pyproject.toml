[project]
name = "mortgage-metrics-platform"
version = "0.1.0"
description = "Batch analytics platform over public HMDA mortgage application data with a governed semantic layer and MCP access for agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Linus Dominic Nathaniel" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0,<3",
    "pyarrow>=18",
    "httpx>=0.27",
    "pyyaml>=6",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "dbt-metricflow[dbt-duckdb]>=0.15,<0.16",
    "mcp>=2.3,<3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=2.9,<3"]

[project.scripts]
mmp = "mmp.cli:main"
mmp-mcp = "mmp.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "sqlfluff>=4.5,<5",
    "sqlfluff-templater-dbt>=4.5,<5",
    "pre-commit>=4",
    "anthropic>=2.9,<3",
]
airflow = [
    "apache-airflow>=3.4,<3.5",
    "astronomer-cosmos>=1.16,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "dags"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
markers = [
    "airflow: DAG integrity tests; need the airflow dependency group",
    "network: hits the real HMDA API; excluded by default",
]
